name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where did this happen?
      options:
        - Desktop app (Personal Workspace)
        - Team Workspace server
        - Online demo (lanesraos.com/demo)
        - Product website
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Desktop app version (Settings/About), or the date you tried the online demo
      placeholder: "e.g. desktop-v0.3.0"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / browser
      placeholder: "e.g. Windows 11, or Chrome 128 on macOS"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, or other context.
