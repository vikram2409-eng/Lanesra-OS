name: Desktop Release

# Builds the Windows installer for the desktop app (desktop/) and attaches
# it to a GitHub Release. Two ways to trigger it:
#   1. Push a tag matching "desktop-v*" (e.g. desktop-v0.1.0)
#   2. Run it manually from the Actions tab ("Run workflow") and supply a
#      version number - useful for a test build without cutting a real tag.
#
# The release is created as a draft + prerelease so nothing goes public
# until a maintainer reviews it on GitHub and clicks "Publish release".

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and tag (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=desktop-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "expected_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "expected_version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tauri.conf.json version matches the release tag
        shell: bash
        run: |
          expected="${{ steps.tag.outputs.expected_version }}"
          actual=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch: releasing tag/input '$expected' but desktop/src-tauri/tauri.conf.json has '$actual'. The built installer filenames are named from tauri.conf.json, not the tag - bump its \"version\" (and desktop/package.json) to $expected and re-tag before releasing."
            exit 1
          fi
          echo "tauri.conf.json version ($actual) matches release $expected - proceeding."

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.tag_name }}
          releaseName: "Lanesra OS Desktop ${{ steps.tag.outputs.tag_name }}"
          releaseBody: |
            Early Access Windows build of the Lanesra OS desktop edition.
            See desktop/README.md for what's included and what's still in progress.
          releaseDraft: true
          prerelease: true
