name: CI

# The regression gate for every pull request and every push to main
# (WP-0003, REQ-PRE-001). Each job is a required status check on main;
# see program/PROTOCOL.md section 13 for the names. The program tracker
# checks live in program.yml.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the program-bot re-trigger the suite after it pushes a regenerated
  # STATUS.md (WP-0018): a GITHUB_TOKEN push does not start new runs, and
  # workflow_dispatch is the documented exception a GITHUB_TOKEN can trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust-lint:
    name: rust (format and lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (desktop/rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p lanesra-core -p lanesra-server -p lanesra-cli --all-targets -- -D warnings

  rust-tests:
    name: rust (tests ${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          shared-key: tests
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests (partition ${{ matrix.partition }} of 4)
        run: >
          cargo nextest run --locked --no-fail-fast
          -p lanesra-core -p lanesra-server -p lanesra-cli
          --partition hash:${{ matrix.partition }}/4
      - name: Doc tests
        if: matrix.partition == 1
        run: cargo test --locked --doc -p lanesra-core -p lanesra-server -p lanesra-cli

  rust-tests-result:
    # One stable required check for branch protection, whatever the shard count.
    name: rust (tests)
    if: always()
    needs: rust-tests
    runs-on: ubuntu-latest
    steps:
      - name: All test partitions passed
        run: test "${{ needs.rust-tests.result }}" = "success"

  tauri:
    name: tauri (desktop shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri on Linux
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          shared-key: tauri
      - name: Build the frontend the shell embeds (frontendDist = ../dist)
        run: npm ci && npm run build
      - run: cargo clippy --locked -p lanesra-os --all-targets -- -D warnings

  web:
    name: web (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  demo:
    name: demo (website and online demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check site-modern-pages.js
      - name: Images and icons are real binaries
        run: python3 program/tools/check_binary_assets.py
      - name: Feature flags (registry rules; demo shows only released features)
        run: python3 program/tools/check_feature_flags.py

  migrations:
    name: migrations (order and numbering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migration numbering (ADR-0003)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 program/tools/check_migrations.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Bot re-trigger after a STATUS.md push (WP-0018): no PR context,
            # so compare against main like a PR would.
            git fetch --no-tags origin main
            python3 program/tools/check_migrations.py --base "origin/main"
          else
            python3 program/tools/check_migrations.py
          fi

  server-image:
    name: server image (Team Workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image versions match the repo pins (rust-toolchain.toml, .nvmrc)
        run: python3 program/tools/check_toolchain_pins.py
      - uses: docker/setup-buildx-action@v3
      - name: Build the image from the lockfile
        uses: docker/build-push-action@v6
        with:
          context: desktop
          load: true
          tags: lanesra-os-server:ci
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Smoke test (health, first run, sign in, restart, data kept)
        run: desktop/scripts/server-image-smoke.sh lanesra-os-server:ci
      - name: Server log
        if: always()
        run: cat /tmp/lanesra-smoke.log || true

  agent-report:
    # The program-bot PR comment for AIs without a shell (WP-0018, REQ-PRE-014):
    # validation result, the WP's acceptance criteria and editions, the
    # requirement trace, and every job's result with links to failing logs.
    # Updates one comment in place via the <!-- program-bot:report --> marker.
    name: agent report (PR comment)
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'wp/')) ||
        (github.event_name == 'workflow_dispatch' &&
         startsWith(github.ref_name, 'wp/'))
      )
    needs: [rust-lint, rust-tests-result, tauri, web, demo, migrations, server-image]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Render and post the program-bot report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            BRANCH="${{ github.ref_name }}"
            PR_NUMBER=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${BRANCH}&state=open" -q '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR for branch $BRANCH; skipping report."
            exit 0
          fi
          WP_ID=$(echo "$BRANCH" | grep -o 'WP-[0-9]*' | head -1)
          WP_FILE=$(ls program/work/P*/${WP_ID}-*.md 2>/dev/null | head -1)
          if [ -z "$WP_FILE" ]; then
            echo "No work package file for $WP_ID; skipping report."
            exit 0
          fi
          python3 program/tools/programctl.py validate > /tmp/validate.txt 2>&1 || true
          python3 program/tools/programctl.py trace > /tmp/trace.txt 2>&1 || true
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            -q '.jobs | map({name, conclusion, html_url})' > /tmp/jobs.json
          python3 program/tools/pr_report.py \
            --validate-output /tmp/validate.txt \
            --wp-file "$WP_FILE" \
            --trace-output /tmp/trace.txt \
            --jobs-json /tmp/jobs.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /tmp/comment.md
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            -q '[.[] | select(.body | startswith("<!-- program-bot:report -->"))][0].id')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -f body="$(cat /tmp/comment.md)" > /dev/null
            echo "Updated program-bot comment $EXISTING."
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
            echo "Posted new program-bot comment."
          fi
