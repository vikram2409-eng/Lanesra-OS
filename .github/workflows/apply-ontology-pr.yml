name: Apply Ontology PR transform
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Transform script path in scripts/'
        required: true
        default: 'apply_ontology_pr1.py'
      branch:
        description: 'Branch to transform and push'
        required: true
        default: 'ontology-graph/pr1-foundation'
      message:
        description: 'Commit message'
        required: false
        default: 'feat: Ontology Graph PR1 — rename + typed edges + traversal + colors + demo data'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/${{ inputs.script }}
      - run: node --check app.js
      - run: |
          git config user.name "Muse (Ontology Graph build)"
          git config user.email "muse@lanesraos.com"
          git add -A
          git diff --cached --quiet || git commit -m "${{ inputs.message }}"
          git push origin ${{ inputs.branch }}
