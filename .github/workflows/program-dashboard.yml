name: Program dashboard

# Publishes the program dashboard (program/dashboard/index.html) with fresh
# data from `programctl export` to GitHub Pages on every push to main, so
# the dashboard is current even when no Claude Code session runs to
# republish the claude.ai copy (WP-0019, REQ-PRE-017).
#
# One-time owner setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: program-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate the tracker
        run: python3 program/tools/programctl.py validate
      - name: Build the site
        run: |
          mkdir -p _site
          python3 program/tools/programctl.py export --out _site/data.json
          python3 program/tools/dashboard_page.py program/dashboard/index.html _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
