name: Program issues mirror

# One-way mirror: program/work/ (source of truth) -> GitHub Issues, one issue
# per work package with phase milestones and status labels (ADR-0004).
# Runs only on main, so the issues always show merged state.

on:
  push:
    branches: [main]
    paths:
      - "program/work/**"
      - "program/tools/issues_mirror.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: program-issues-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate before mirroring
        run: python3 program/tools/programctl.py validate
      - name: Sync issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 program/tools/issues_mirror.py --repo "${{ github.repository }}"
