services:
  lanesra:
    # Build from source, or comment out `build:` and use the image published
    # with each release: ghcr.io/vikram2409-eng/lanesra-os-server:<version>
    # Setup, internet exposure, backups and upgrades:
    # https://lanesraos.com/help/set-up-team-workspace
    build: .
    image: lanesra-os-server
    ports:
      - "8080:8080"
    volumes:
      - lanesra-data:/data
    restart: unless-stopped
    # Uncomment if exposing this on the open internet behind a reverse
    # proxy that terminates TLS (see README.md "Exposing it on the open
    # internet"). Leave commented out for a LAN-only, plain-HTTP deployment.
    # environment:
    #   LANESRA_TRUST_PROXY_HTTPS: "1"
    #   LANESRA_ALLOWED_ORIGINS: "https://lanesra.example.com"

volumes:
  lanesra-data:
