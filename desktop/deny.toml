# cargo-deny configuration (WP-0011)
# https://embarkstudios.github.io/cargo-deny/
# Format for cargo-deny >= 0.14 (migrated per EmbarkStudios/cargo-deny#611)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
# vulnerability, notice, unmaintained use the new lint format below

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
