# cargo-deny configuration (WP-0011)
# https://embarkstudios.github.io/cargo-deny/
# Format for cargo-deny >= 0.14 (migrated per EmbarkStudios/cargo-deny#611)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# chacha20 0.10.1 (yanked) was updated to 0.10.2 with `cargo update`.
yanked = "deny"
# Exceptions (per owner instruction 2026-10-17: fix before exempt)
# Each exception has: reason, RAID R- entry, review date
#
# RUSTSEC-2026-0367, 0368, 0369 (zip 0.6.6):
#   Reason: Fixed in 9.0.0 (major bump). Cargo.toml pins zip to "0.6"; no fixed
#     version exists within the 0.6 range. Upgrading to 9.x requires API migration.
#   RAID: R-20 | Review: 2026-11-17
# RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack):
#   Reason: No patched version exists (advisory states "no patched versions" as of 2026-09-12).
#   RAID: R-21 | Review: 2026-11-17
# RUSTSEC-2024-0449 (unsafe-libyaml unmaintained):
#   Reason: No safe upgrade available (repository archived).
#   RAID: R-22 | Review: 2026-11-17
# RUSTSEC-2024-0370 (proc-macro-error):
#   Reason: unmaintained crate pulled in only by the GTK desktop stack (glib-macros);
#     not a direct dependency, no upstream replacement yet. The unic-* advisories
#     (RUSTSEC-2025-0075, 0080, 0081, 0098, 0100) left with Tauri 2.12, whose
#     urlpattern no longer uses them.
#   RAID: R-25 | Review: 2026-11-17
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2024-0370",
]

[licenses]
# Baseline: allowlist of licenses (unlicensed check removed in cargo-deny 0.14)
confidence-threshold = 0.8
allow = [
    "MIT",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
]
exceptions = []

[bans]
# Baseline: warn on issues (tighten after review)
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
