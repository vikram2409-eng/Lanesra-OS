# cargo-deny configuration (WP-0011)
# https://embarkstudios.github.io/cargo-deny/
# Format for cargo-deny >= 0.14 (migrated per EmbarkStudios/cargo-deny#611)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# yanked = "warn" for baseline (chacha20 0.10.1 is yanked, transitive via tokio-postgres)
# TODO: update chacha20, then set back to "deny"
yanked = "warn"
# Pre-existing exceptions (documented 2026-10-17, WP-0011 baseline):
# - RUSTSEC-2026-0367, 0368, 0369: zip 0.6.6 vulnerabilities (upgrade to >=9.0.0 planned)
# - chacha20 0.10.1 yanked (transitive via tokio-postgres; update planned)
# These are NOT new findings; the baseline fails on NEW high-severity issues.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
# Baseline: allowlist of licenses (unlicensed check removed in cargo-deny 0.14)
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = []

[bans]
# Baseline: warn on issues (tighten after review)
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
