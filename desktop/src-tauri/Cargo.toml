[package]
name = "lanesra-os"
version = "0.3.0"
description = "Lanesra OS Desktop - local-first business management application"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lanesra_os_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
lanesra-core = { path = "../core" }

[dev-dependencies]
