[package]
name = "lanesra-core"
version = "0.13.0"
description = "Lanesra OS domain logic, shared by the desktop app and the Team Workspace server"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lanesra_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# The "bundled" SQLite build already compiles in FTS5 (libsqlite3-sys's
# build script always sets -DSQLITE_ENABLE_FTS5 for a bundled build) - no
# separate feature flag needed for `record_search_fts` (Phase 7b's Context
# Layer) to work.
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
thiserror = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
regex = "1"

# Integration Hub - outbound HTTP (Connections/Connectors/webhook delivery/OAuth2
# token exchange), secrets-at-rest and signing. See
# services/secret_service.rs / connection_service.rs for how these are used;
# only the small set of functions that genuinely make a network call are
# `async fn` - everything else in this crate stays plain sync, as before.
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# SQL connectors - PostgreSQL, MySQL/MariaDB, SQL Server. All three are
# pure-Rust wire-protocol drivers (no native libpq/libmysqlclient/ODBC
# dependency), and all use rustls rather than native-tls/OpenSSL, matching
# reqwest's own "rustls-tls" feature choice above - no new OpenSSL
# dependency anywhere in this crate.
tokio-postgres = "0.7"
mysql_async = { version = "0.34", default-features = false, features = ["rustls-tls"] }
# SQL Server (tiberius): implemented and code-reviewed, but this sandbox
# has no SQL Server build to prove it against live (unlike Postgres/MySQL,
# which are both proven against real local servers in this crate's own
# tests) - see sqlserver_service.rs's own doc comment for the stated gap.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
# SFTP connector - pure-Rust client *and* server, so the in-process test
# double needs no system SFTP daemon.
russh = "0.44"
russh-sftp = "2"
async-trait = "0.1"
# Email/SMTP connector action.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
# Data Exchange (spec §12/§13): a real RFC 4180 CSV parser/writer for the
# generalized import/export wizard - quoted fields, embedded commas and
# escaped quotes handled correctly, not a naive split(',').
csv = "1"
