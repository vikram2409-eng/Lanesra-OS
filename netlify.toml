[build]
  publish = "."
  # Skip the build entirely when a push/PR only touches desktop/** - the
  # published site is everything else at the repo root (app.js, index.html,
  # the other public pages), and desktop-only changes (the Tauri app, the
  # Rust core, its tests) have nothing to deploy here. Without this, every
  # push to every branch triggers a full build + deploy (production and
  # every PR's deploy preview), which is most of what was burning through
  # build minutes/credits on a repo that ships both a website and a
  # separate desktop app from the same tree.
  #
  # `git diff --quiet ... -- . ':!desktop'` exits 0 (no differences outside
  # desktop/) when the only changes are under desktop/, and exits non-zero
  # the moment anything else changed - Netlify's convention is exit 0 =
  # skip this build, non-zero = build normally, so no extra wrapping is
  # needed. Applies to production and PR deploy-preview builds alike.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!desktop'"

[[redirects]]
  from = "/backlog"
  to = "/roadmap"
  status = 301

[[redirects]]
  from = "/changelog"
  to = "/releases"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=(self): Voice-First Mode's own SpeechRecognition needs it -
    # an empty microphone=() allowlist (this site's previous setting) blocks
    # mic capture for every origin including this one, so the browser fails
    # the request before the user is ever asked, with no permission prompt
    # at all. Still denies every third-party origin (no bare "self" plus
    # others), and camera/geolocation stay fully locked down - neither is
    # used anywhere in this product.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# app.js/index.html/styles.css change on nearly every release, and the
# ?v=X.Y.Z cache-busting query string on the <script> tag only helps a
# browser that actually re-fetches index.html itself first - several
# mobile/in-app browsers (iOS Safari and WebKit-based "Chrome"/"Gemini"
# browsers among them) have been observed serving a stale disk-cached copy
# of these exact files even across a normal reload, no query string in
# sight to bust. `no-cache` (not `no-store`) keeps the browser's copy but
# forces a conditional revalidation request (If-None-Match/If-Modified-
# Since) on every load, so a stale copy can only ever survive until the
# very next request reaches Netlify - a real fix rather than relying on
# every future release remembering to bump a version number.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
