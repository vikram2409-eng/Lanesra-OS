[build]
  publish = "."

[[redirects]]
  from = "/backlog"
  to = "/roadmap"
  status = 301

[[redirects]]
  from = "/changelog"
  to = "/releases"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
